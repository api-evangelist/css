summary: >-
  CSS publishes no single dated changelog, because CSS is not one document. The nearest
  first-party equivalents are recorded here: the annual CSS Snapshot, which is the dated
  statement of what "CSS" contains in a given year, and the dated release tags of the CSS
  Validation Service. Individual modules carry their own "Changes" section in each TR
  publication.
