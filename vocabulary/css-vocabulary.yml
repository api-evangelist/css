name: CSS Vocabulary — properties and descriptors
description: >-
  The CSS vocabulary as published by the W3C CSS Working Group. W3C generates two
  machine-readable JSON indexes from the CSS specifications themselves and serves them
  from w3.org: every CSS property and every at-rule descriptor, each with the spec that
  defines it, the anchor URL of its definition, and the W3C maturity status of that
  definition. Both files in this directory are saved verbatim from those URLs.
