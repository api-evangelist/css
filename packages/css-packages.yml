source: >-
  registry.npmjs.org metadata endpoints, https://jigsaw.w3.org/css-validator/DOWNLOAD.html
  and the GitHub releases API for w3c/css-validator
note: >-
  CSS is a specification, not a product, so there is no client SDK for "the CSS API" and
  none is claimed here. What the W3C does publish are (a) machine-readable extracts of the
  CSS specifications, shipped to npm from the w3c/webref and w3c/browser-specs repositories,
  and (b) the CSS Validator itself, distributed as a runnable jar. Only packages published
  from a repository in the w3c GitHub organization are marked official.
