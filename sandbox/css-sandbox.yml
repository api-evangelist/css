summary: >-
  The CSS Validation Service is itself a public console: three forms — by URL, by file upload,
  and by direct input — let anyone run a real validation with no account and no key. There is
  no separate sandbox because there is no live/test distinction to draw: the service is
  read-only and free, so the console and production are the same surface.
console:
  url: https://jigsaw.w3.org/css-validator/
  http_status: 200
  auth_required: false
  modes:
    - name: Validate by URL
      description: Enter the URL of an HTML or CSS document. @import rules are followed.
    - name: Validate by file upload
      description: >-
        Upload a local file. CSS only — HTML uploads are rejected — and @import is followed
        only when it references a public URL, so relative paths will not resolve.
    - name: Validate by direct input
      description: >-
        Paste a CSS fragment into a textarea. W3C recommends this mode for test cases and bug
        reports because the resulting URL is linkable.
  source: https://jigsaw.w3.org/css-validator/manual.html
