summary: >-
  There are no plans and no pricing page, and that is a finding rather than a gap. CSS is a
  royalty-free W3C standard and the CSS Validation Service is described in its own manual as
  "a free, public service for all". Nobody is billed, nobody signs up, and there is no paid
  tier to move to — the escalation path for heavy use is to run your own instance, not to buy
  one. W3C funds this through membership and donations.
