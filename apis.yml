apis:
  - name: W3C CSS Validation Service
    description: >-
      The W3C's public CSS validator, exposed as a web service. A single safe operation checks
      a stylesheet — supplied either as a URL or as inline text — against a chosen CSS profile
      and returns the errors and warnings found, in XHTML, plain text, SOAP 1.2 or JSON. It is
      anonymous and free, and W3C publishes a WSDL 2.0 description of the SOAP interface. This
      is the only callable HTTP surface associated with CSS; CSS itself is a specification, not
      a hosted service.
    humanURL: https://jigsaw.w3.org/css-validator/
    baseURL: https://jigsaw.w3.org/css-validator/validator
