name: CSS (Cascading Style Sheets)
description: >-
  Cascading Style Sheets (CSS) is a W3C web standard for describing the
  presentation of documents written in HTML and XML, including layout, colors,
  typography, and animations. CSS is a foundational web technology defined by
  the W3C CSS Working Group and is implemented natively by every major web
  browser. The CSS Object Model (CSSOM) and CSS Houdini extensibility APIs
  expose CSS to JavaScript at runtime.
